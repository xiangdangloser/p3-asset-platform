<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>注册 - P3 资产监控平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-400">注册新账号</h2>
        
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">用户名</label>
            <input type="text" id="username" class="w-full bg-gray-700 border border-gray-600 rounded p-2 focus:outline-none focus:border-blue-500" placeholder="请输入用户名">
        </div>
        
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">密码</label>
            <input type="password" id="password" class="w-full bg-gray-700 border border-gray-600 rounded p-2 focus:outline-none focus:border-blue-500" placeholder="请输入密码">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium mb-1">确认密码</label>
            <input type="password" id="confirmPassword" class="w-full bg-gray-700 border border-gray-600 rounded p-2 focus:outline-none focus:border-blue-500" placeholder="请再次输入密码">
        </div>

        <button onclick="register()" id="registerBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded transition duration-200">注 册</button>
        
        <div class="text-center mt-4 text-sm text-gray-400">
            已有账号？ <a href="/login" class="text-blue-400 hover:underline">去登录</a>
        </div>
    </div>

    <script src="/static/js/register.js"></script>
</body>
</html>
